<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khabar AI – Brand Governance</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--secondary:#10b981;--danger:#ef4444;--warning:#f59e0b;--dark:#1e293b;--gray:#64748b;--gl:#e2e8f0;--success:#059669;--patient:#8b5cf6;--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--pr:#2563eb;--prt:#fff;--hi:#fde68a;--ok:#059669;--wa:#f59e0b;--er:#ef4444;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:var(--bg);color:var(--dark);line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:300}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
#toast{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:20px;z-index:99999;background:var(--dark);color:#fff;padding:14px 20px;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:in .3s}
#toast.success{background:var(--success)}#toast.error{background:var(--danger)}
@keyframes in{from{opacity:0;transform:translateY(-10px)}}
header.app{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:env(safe-area-inset-top,0px);z-index:100}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:15px 0;gap:12px}
.logo{font-size:1.8rem;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:10px;cursor:pointer}
.up{display:flex;align-items:center;gap:12px}
.profile-circle{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.btn{padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;border:2px solid var(--gl);background:#fff;color:var(--dark);transition:all .3s;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.85rem}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.lg{padding:14px 30px;font-size:1rem}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}.btn.p:hover{background:var(--primary-dark);color:#fff}
.btn.g{background:var(--secondary);border-color:var(--secondary);color:#fff}.btn.g:hover{background:#0da271;color:#fff}
.btn.r{color:var(--danger);border-color:var(--danger)}.btn.r:hover{background:var(--danger);color:#fff}
.btn.o{background:transparent;border-color:var(--primary);color:var(--primary)}.btn.o:hover{background:var(--primary);color:#fff}
.btn.w{background:#fff;border-color:#fff;color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--gl);border-radius:8px;font-size:.95rem;background:#fff;color:var(--dark);transition:border-color .3s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{min-height:170px;resize:vertical}
.fg{margin-bottom:18px}.fg label{display:block;margin-bottom:6px;font-weight:600}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.dash{padding:30px 20px 60px}
.shell{display:flex;align-items:flex-start;width:100%;min-height:calc(100vh - 71px)}
.side{width:240px;flex:none;position:sticky;top:calc(71px + env(safe-area-inset-top,0px));height:calc(100vh - 71px - env(safe-area-inset-top,0px));overflow-y:auto;background:linear-gradient(180deg,#0f172a,#0b1220);border-right:0;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .srole{color:#60a5fa;font-weight:800;letter-spacing:.14em;font-size:.8rem;padding:2px 12px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.side .sl{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b;padding:4px 12px 8px}
.sb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:0;background:none;color:#cbd5e1;font-size:.95rem;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.sb span:first-child{font-size:1.2rem;width:26px;text-align:center}
.sb:hover{background:rgba(255,255,255,.07);color:#fff}.sb.on{background:var(--primary);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.content{flex:1;min-width:0;max-width:1280px;margin:0 auto}
.menu{display:none;border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--dark);padding:4px 8px}
.scrim{display:none}
@media(max-width:820px){.menu{display:inline-block}.side{position:fixed;left:0;top:calc(71px + env(safe-area-inset-top,0px));bottom:0;height:auto;z-index:150;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 24px rgba(0,0,0,.15)}.side.open{transform:none}.scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:140}.dash{padding:20px 14px 40px}}
h2{font-size:1.8rem;margin-bottom:4px}h3{margin-bottom:10px;font-size:1.05rem}.mu{color:var(--gray);font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:32px;background:#f0f9ff;color:var(--primary);border:1.5px solid #bfdbfe;font-size:.85rem;font-weight:600;margin:4px 4px 0 0}
.chip button{border:0;background:none;color:var(--gray);cursor:pointer}
mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 2px;cursor:pointer}mark.sel{outline:2px solid var(--primary)}
.view{white-space:pre-wrap;border:2px solid var(--gl);border-radius:8px;padding:12px;background:#f8fafc;min-height:170px}
.f{background:#fff;border:1px solid var(--gl);border-left:5px solid var(--warning);border-radius:12px;padding:14px;margin-bottom:12px;transition:box-shadow .2s}.f.high{border-left-color:var(--danger)}.f.sel{box-shadow:0 0 0 2px var(--primary)}
.tag{font-size:.75rem;padding:3px 9px;border-radius:20px;background:#f1f5f9;font-weight:600;margin-right:4px}
.st{padding:5px 12px;border-radius:20px;font-size:.82rem;font-weight:600;background:#e2e8f0;color:var(--gray)}
.st.Approved{background:rgba(5,150,105,.1);color:var(--success)}.st.ChangesRequested{background:rgba(239,68,68,.1);color:var(--danger)}.st.InReview{background:rgba(245,158,11,.12);color:#b45309}
.sw{width:30px;height:30px;border-radius:8px;border:1px solid var(--gl);cursor:pointer}
.ok{color:var(--success)}.er{color:var(--danger)}
.cm{border-bottom:1px solid var(--gl);padding:8px 0}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:100;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.bnav ul{display:flex;justify-content:space-around;list-style:none;max-width:1200px;margin:0 auto;padding:0 20px}
.bn{display:flex;flex-direction:column;align-items:center;color:var(--gray);padding:8px 12px;border-radius:8px;flex:1;max-width:130px;cursor:pointer;background:none;border:none;transition:all .3s}
.bn:hover,.bn.on{color:var(--primary);background:#f0f9ff}.bn span:first-child{font-size:1.3rem}.bn span:last-child{font-size:.75rem;font-weight:500}
/* landing */
.lh{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:200;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.hero{min-height:100vh;background:linear-gradient(160deg,#f0f7ff 0%,#e8f4fd 40%,#dbeafe 100%);display:flex;align-items:center;position:relative;overflow:hidden;padding:100px 0 40px}
.hc{position:relative;z-index:2;max-width:620px}
.hc h1{font-size:3.2rem;font-weight:800;color:#0f172a;line-height:1.18;margin-bottom:20px}.hc h1 span{color:var(--primary)}
.hc p{font-size:1.1rem;color:#475569;margin-bottom:32px;line-height:1.75}
.badge{display:inline-flex;gap:6px;background:#dbeafe;border:1.5px solid #bfdbfe;color:var(--primary);padding:6px 14px;border-radius:32px;font-size:.8rem;font-weight:600;margin-bottom:20px}
.hv{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:460px;z-index:1;pointer-events:none}
.stats{display:flex;margin-top:48px;flex-wrap:wrap;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.07);overflow:hidden;border:1px solid var(--gl)}
.stat{text-align:center;padding:20px 24px;flex:1;border-right:1px solid var(--gl)}.stat:last-child{border:0}
.stat b{display:block;font-size:1.7rem;font-weight:800;color:var(--primary);line-height:1}.stat span{font-size:.78rem;color:var(--gray);font-weight:500}
.sec{padding:80px 0}.sec.alt{background:#fff}
.sect{text-align:center;margin-bottom:48px}.sect h2{font-size:2.2rem;font-weight:800}.sect p{color:var(--gray);max-width:560px;margin:10px auto 0}
.fc{background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 4px 20px rgba(0,0,0,.06);transition:transform .25s,box-shadow .25s;border-top:4px solid var(--primary)}
.fc:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(37,99,235,.12)}
.fi{width:56px;height:56px;border-radius:14px;color:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.fc h3{font-size:1.1rem}.fc p{color:var(--gray);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px}
.step{text-align:center;padding:24px 16px}.step i{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;font:800 1.3rem sans-serif;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.step p{color:var(--gray);font-size:.88rem}
.cta{background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:80px 0;text-align:center}.cta h2{color:#fff;font-size:2.4rem;font-weight:800;margin-bottom:14px}.cta p{color:rgba(255,255,255,.8);margin-bottom:30px}
.foot{background:#0f172a;color:#94a3b8;padding:36px 0;font-size:.85rem}.foot .logo{color:#fff;margin-bottom:10px;font-size:1.4rem;cursor:default}
/* auth */
.aw{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#f0f7ff,#dbeafe)}
.ac{width:100%;max-width:460px;background:#fff;border-radius:16px;padding:40px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.at{display:flex;margin-bottom:26px;border-bottom:2px solid var(--gl)}.at div{flex:1;padding:14px;text-align:center;font-weight:600;cursor:pointer;color:var(--gray);border-bottom:3px solid transparent}.at div.on{color:var(--primary);border-bottom-color:var(--primary)}
.stack{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.stack .card{border-left:6px solid var(--primary);padding-left:96px;position:relative;min-height:96px}
.stack .card::before{content:attr(data-i);position:absolute;left:24px;top:24px;width:52px;height:52px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.stack .card>input[type=file]{max-width:420px}
@media(max-width:600px){.stack .card{padding-left:24px;padding-top:88px}}
.stt{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;background:#f1f5f9;color:var(--gray);white-space:nowrap}
.stt.Open{background:rgba(245,158,11,.14);color:#b45309}.stt.Accepted,.stt.Edited{background:rgba(5,150,105,.1);color:var(--success)}.stt.Dismissed{background:#e2e8f0;color:var(--gray)}
.fl{padding:6px 14px;border-radius:20px;border:1.5px solid var(--gl);background:#fff;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--dark)}.fl.on{background:var(--primary);border-color:var(--primary);color:#fff}
.detail{background:#f8fafc;border:2px solid #bfdbfe;border-radius:12px;padding:14px;margin-top:14px}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.88rem}.warn.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.tli{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--gl);margin-left:8px}.tli::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary)}.tli.bad::before{background:var(--danger)}.tli.good::before{background:var(--success)}
.ex{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--gl);border-radius:10px;padding:10px 14px;margin-top:8px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:14px 0}.sc{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-top:4px solid var(--primary)}.sc b{display:block;line-height:1.3;word-break:break-word}
.rs{width:auto;padding:6px 10px;font-size:.85rem}
.tg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}.tg input{width:18px;height:18px;margin-top:3px;accent-color:var(--primary);flex:none}
.pr-only{display:none}
@media print{.pr-only{display:block}header.app,.side,.scrim,.bnav,.noprint,body::before{display:none!important}.dash{padding:0}.card{box-shadow:none}}
.stt.Sourced{background:rgba(37,99,235,.1);color:var(--primary)}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}
.score{display:flex;align-items:center;gap:14px;background:#f8fafc;border:1px solid var(--gl);border-radius:12px;padding:10px 14px;margin:8px 0}.score b{font-size:2.2rem;line-height:1}
@media(max-width:820px){.hv{display:none}.hc h1{font-size:2.3rem}.profile-circle+div{display:none}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{border:2px solid var(--gl);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--dark);font-size:.85rem}.seg button small{color:var(--gray);font-size:.72rem}.seg button.on{border-color:var(--primary);background:#f0f9ff}.seg button:disabled{opacity:.5;cursor:not-allowed}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.ct{border:2px solid var(--gl);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--dark)}.ct.on{border-color:var(--primary);background:#f0f9ff}.ct>span{font-size:.8rem;font-weight:600}.ct b{font-size:1.4rem;line-height:1}.ct small{color:var(--gray);font-size:.72rem}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ba>div{padding:10px;border-radius:8px;font-size:.88rem;white-space:pre-wrap;word-break:break-word}.ba .bf{background:#fef2f2;border:1px solid #fecaca}.ba .af{background:#ecfdf5;border:1px solid #a7f3d0}del{background:#fecaca;color:#991b1b}ins{background:#a7f3d0;color:#065f46;text-decoration:none}
@media(max-width:520px){.seg,.ba{grid-template-columns:1fr}}
.st.Rejected{background:rgba(239,68,68,.1);color:var(--danger)}
.split{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}.q1{flex:1 1 280px;max-width:380px}.q2{flex:3 1 460px;min-width:0}
.qi{cursor:pointer;border:1px solid var(--gl);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}.qi.on{border-color:var(--primary);background:#f0f9ff}
.tw{overflow-x:auto}.tw table{width:100%;border-collapse:collapse}.tw th,.tw td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--gl);font-size:.88rem;white-space:nowrap}
.big{display:block;font-size:2rem;font-weight:800;line-height:1.2}

/* landing matches app */
.lh{background:#0f172a;box-shadow:0 2px 12px rgba(0,0,0,.35)}.lh .logo{color:#fff}
.lh .btn:not(.p),.hero .btn:not(.p){background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}.lh .btn:not(.p):hover,.hero .btn:not(.p):hover{background:rgba(255,255,255,.1);color:#fff}
.hero{background:linear-gradient(160deg,#0f172a 0%,#111c3a 55%,#1e3a8a 100%)}
.hc h1{color:#fff}.hc h1 span{color:#60a5fa}.hc p{color:#cbd5e1}
.badge{background:rgba(37,99,235,.22);border-color:rgba(96,165,250,.4);color:#93c5fd}
.stats{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);box-shadow:none}.stat{border-right-color:rgba(255,255,255,.12)}.stat b{color:#60a5fa}.stat span{color:#94a3b8}
.sec.alt{background:var(--bg)}.sec{background:#fff}.sec .sect p{color:var(--gray)}
.fc{border-top:0;border-left:6px solid var(--primary);box-shadow:0 4px 12px rgba(0,0,0,.05);border-radius:12px}
.fi{border-radius:12px}
.aw{background:linear-gradient(160deg,#0f172a,#1e3a8a)}
.mock{display:flex;width:480px;height:320px;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);background:#f1f5f9;font-size:.85rem}
.mside{width:150px;background:linear-gradient(180deg,#0f172a,#0b1220);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.mr{color:#60a5fa;font-weight:800;letter-spacing:.14em;font-size:.7rem;padding:0 8px 10px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.mi{color:#cbd5e1;padding:9px 10px;border-radius:8px;font-size:.8rem}.mi.on{background:#2563eb;color:#fff;font-weight:700}
.mmain{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}.mt{font-weight:800;color:#1e293b;font-size:1rem}
.mc{background:#fff;border-left:5px solid;border-radius:10px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column}.mc span{color:#64748b;font-size:.75rem}
.mscore{background:#fff;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.mscore b{font-size:1.8rem;color:#f59e0b;line-height:1}.mscore span{color:#64748b}
@media(max-width:900px){.hv{display:none}}
.sbrand{display:none;color:#fff;font-weight:900;letter-spacing:.2em;font-size:1.3rem;padding:2px 12px 6px}
@media(min-width:821px){.side{position:fixed;left:0;top:0;height:100vh;width:240px;padding-top:24px;z-index:120}.sbrand{display:block}header.app{margin-left:240px}header.app .logo,header.app .menu{display:none}.shell{padding-left:240px}}
@media print{.shell{padding-left:0}header.app{margin-left:0}}
.stp{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.stp>div{flex:1 1 130px;border:2px solid var(--gl);border-radius:10px;padding:8px 10px;font-size:.82rem}.stp .dn{border-color:var(--success);background:#ecfdf5}.stp .bd{border-color:var(--danger);background:#fef2f2}
.xg{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:.88rem;margin:8px 0}.xg>b{color:var(--gray)}
.s4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}.s4>div{border:1px solid var(--gl);border-radius:12px;padding:10px;background:#f8fafc}.s4 b{font-size:1.6rem;display:block;line-height:1.1}
del{background:#fecaca}ins{background:#bbf7d0;text-decoration:none}
.vimg{position:relative;display:inline-block;max-width:100%;line-height:0}.vimg img{max-width:100%;max-height:520px;border-radius:8px}.vbx{position:absolute;border:2px solid;border-radius:3px}
/* notifications + revision tracking */
.bell{position:relative}
.bellb{position:relative;width:40px;height:40px;border-radius:50%;border:2px solid var(--gl);background:#fff;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;padding:0}
.bellb:hover{border-color:var(--primary)}
.nbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.npanel{position:absolute;right:0;top:50px;width:380px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--gl);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:400;padding:12px}
.nscrim{position:fixed;inset:0;z-index:399}

function review(text,kb,ai){
  const out=[];const add=(m,o)=>out.push({start:m.index,end:m.index+m[0].length,match:m[0],...o});

// ---- Rule intelligence: which rules writers/managers keep dismissing or contradicting ----
function ruleIntel(drafts){
  const lc=s=>String(s||"").toLowerCase(),R={},H={},g=rule=>R[rule]||(R[rule]={rule,n:0,res:0,acc:0,dis:0,reasons:[],ph:{},mfp:0,mval:0,mix:0});
  (drafts||[]).forEach(d=>{allF(d).forEach(i=>{const r=g(i.rule);r.n++;if(i.status!=="Open"){r.res++;const k=lc(i.match),h=H[i.rule+"|"+k]||(H[i.rule+"|"+k]={rule:i.rule,a:0,d:0});if(i.status==="Dismissed"){r.dis++;h.d++;r.ph[k]=(r.ph[k]||0)+1;if(i.note)r.reasons.push(i.note)}else{r.acc++;h.a++}}});
    Object.values(d.mgr||{}).forEach(m=>{const r=g(m.rule);if(m.v==="fp")r.mfp++;if(m.v==="valid")r.mval++})});
  Object.values(H).forEach(h=>{if(h.a&&h.d)g(h.rule).mix++});
  return Object.values(R).map(r=>{const rate=r.res?Math.round(r.dis*100/r.res):0,mt=r.mfp+r.mval,mrate=mt?Math.round(r.mfp*100/mt):0,why=[];
    if(r.res>=3&&rate>=50)why.push("Writers dismissed "+rate+"% of its resolved findings");
    if(mt>=3&&mrate>=40)why.push("Managers marked "+mrate+"% of its findings as false positives");
    if(r.mix>=1)why.push(r.mix+" phrase"+(r.mix>1?"s were":" was")+" accepted in some drafts and dismissed in others");
    return{...r,rate,mt,mrate,why,amb:why.length>0,freq:r.dis+r.mfp}})}

// ---- Error boundary: a crash in one screen shows a message instead of a blank page ----
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(err){return{err}}
  componentDidCatch(err,info){console.error("Khabar AI screen error:",err,info&&info.componentStack)}
  componentDidUpdate(prev){if(this.state.err&&prev.resetKey!==this.props.resetKey)this.setState({err:null})}
  render(){if(!this.state.err)return this.props.children;
    return <div className="card" style={{borderLeft:"6px solid var(--danger)"}}><h3>Something went wrong on this screen</h3>
      <p className="mu">The rest of the app is still working. Try another menu item, or reload. Details for support:</p>
      <pre style={{whiteSpace:"pre-wrap",fontSize:".8rem",background:"#f8fafc",padding:10,borderRadius:8}}>{String(this.state.err&&this.state.err.message||this.state.err)}</pre>
      <div className="row"><button className="btn p" onClick={()=>this.setState({err:null})}>Try again</button><button className="btn" onClick={()=>window.location.reload()}>Reload app</button></div></div>}}

function Review({doc,setDoc,kb,drafts,setCur,newDraft}){

  const items=[...doc.found.map(f=>({...f,status:"Open"})),...doc.resolved];
  const F={All:()=>true,"High severity":i=>i.sev==="high","Low severity":i=>i.sev==="low",Unresolved:i=>i.status==="Open",Dismissed:i=>i.status==="Dismissed"};
  const list=items.filter(F[flt]).filter(i=>cf==="All"||CAT_OF(i.rule)===cf),cur=items.find(i=>i.id===sel);
  const strip=f=>{const {start,end,status,...r}=f;return r};

    setDoc(d=>runR(touch({...d,text:t,revs:[...d.revs,{text:t,t:nowS(),note:kind+": “"+f.match+"” → “"+rep+"”"}],resolved:[...d.resolved,{...strip(f),id:rid,status:kind,note:rep}]}),kb));setSel(rid);setMode(null)};
  const dismiss=f=>{if(!dis.trim())return;const rid=f.id+"#"+Date.now(),reason=dis;
    setDoc(d=>({...d,dismissed:[...d.dismissed,f.key],found:d.found.filter(x=>x.id!==f.id),resolved:[...d.resolved,{...strip(f),id:rid,status:"Dismissed",note:reason}]}));setDis("");setSel(rid);setMode(null)};
  const attach=f=>{if(!srcT.trim())return;const rid=f.id+"#"+Date.now(),s=srcT;setDoc(d=>({...d,sourced:[...(d.sourced||[]),f.key],found:d.found.filter(x=>x.id!==f.id),resolved:[...d.resolved,{...strip(f),id:rid,status:"Sourced",note:s}],tl:[...d.tl,ev("Creator","Source attached for “"+f.match+"”",s)]}));setSrcT("");setSel(rid);setMode(null)};
  const segs=[];let p=0;

        {doc.engine==="rules"&&<div className="warn"> <b>Rules-based review completed.</b> No Anthropic API key is needed. This local engine checks banned terms, preferred terminology, unsupported statistics and superlatives, tone patterns, accessibility patterns, and configured visual rules. It does not understand meaning like a large language model, so have a human reviewer verify nuanced claims.</div>}<h3>Highlighted draft</h3><div className="view">{segs}</div></div>

        {doc.reviewedText!==null&&!list.length&&<p className={flt==="All"&&cf==="All"?"ok":"mu"}>{flt==="All"&&cf==="All"?"✓ No findings. Ready to submit for approval.":"Nothing in this filter."}</p>}
        {RCATS.map(c=>{const g=list.filter(i=>CAT_OF(i.rule)===c);return g.length?<div key={c}><h3 style={{margin:"14px 0 8px"}}>{CAT_ICON[c]} {c} <span className="mu">({g.length})</span></h3>{g.map(renderRow)}</div>:null})}
        <EvidencePanel doc={doc} kb={kb}/>
        {(kb.rs||{}).aiDisclose!==false&&<p className="mu" style={{marginTop:12}}>AI-use disclosure: automated review{doc.meta?" ("+doc.meta.model+")":""}, advisory only. Managers can override any finding. Nothing is auto-published.</p>}</div>
    </div></div>;

function Workflow({doc,setDoc,user,rs,addN,onEdit}){
  const [c,setC]=useState("");
  const role=user.role,who=user.name+" ("+role+")",fresh=doc.reviewedText===doc.text,unres=doc.found.length;
  const act=(status,e,extra)=>{const note=c.trim();setDoc(d=>({...d,status,...extra,comments:note?[...d.comments,{by:who,text:note,t:nowS()}]:d.comments,tl:[...d.tl,ev(who,e,note)],revs:[...d.revs,{text:d.text,t:nowS(),note:e}]}));
    if(isM){const ty=/^Approved/.test(e)?"approved":/^Changes/.test(e)?"changes":/^Rejected/.test(e)?"rejected":null;if(ty&&addN)addN(doc,ty,note,who)}setC("")};
  const base=baseSnap(doc),changed=base===null||base!==doc.text,nextRev=rounds(doc)+1,blocked=!!(rs&&rs.hrBlock&&doc.found.some(f=>f.sev==="high"));
  const isC=role==="Creator",isM=role==="Manager",st=doc.status;
  return <div><h2>Review &amp; Approval</h2><p className="mu">Use the role switcher in the header to act as Creator or Manager (demo).</p>
    {(st==="Changes Requested"||st==="Rejected")&&doc.reason&&<div className="warn bad"><b>{doc.status==="Rejected"?"Rejected":"Changes requested"}{doc.reviewer?" by "+doc.reviewer:""}:</b> {doc.reason}</div>}
    {st==="Approved"&&<div className="warn" style={{background:"#ecfdf5",borderColor:"#a7f3d0",color:"#065f46"}}>✓ Approved by <b>{doc.approvedBy}</b> on {doc.approvedAt}.{doc.approval&&doc.approval.validUntil&&<> Valid until <b>{fmtDate(doc.approval.validUntil)}</b>, then it goes back for re-review.</>} Editing the draft will reset it to Draft.</div>}
    {st==="In Review"&&doc.rereview&&<div className="warn"><b>↻ Re-review:</b> {doc.rereview.why}. Your approved content is back with the Manager.</div>}
    <div className="grid"><div className="card"><h3>{doc.title||"Untitled"} <span className={"st "+st.replace(" ","")}>{st}</span>{rounds(doc)>0&&<span className="rvb">Revision {rounds(doc)}</span>}</h3>
      {isC&&needsRev(doc)&&<div className="rvbox"><b>↻ Revise &amp; resubmit (revision {nextRev})</b>
        <p className="mu" style={{margin:"4px 0 8px"}}>1) Edit the draft · 2) re-run the AI review · 3) describe what you changed · 4) resubmit.</p>
        <div style={{marginBottom:8}}><b>Manager’s feedback:</b> {doc.reason||(lastDec(doc)||{}).note||"—"}</div>
        {base!==null&&(changed?<><b>Your changes since the version the Manager saw:</b><DiffBox a={base} b={doc.text} la="Reviewed version" lb="Your updated draft"/></>:<div className="warn" style={{margin:0}}>No edits yet. Update the draft to address the feedback.</div>)}
        <div className="row"><button className="btn p" onClick={onEdit}>✎ Edit draft in AI Content Review</button></div></div>}
      <div className="view" style={{minHeight:80}}>{doc.text||"No content yet."}</div>
      <p className="mu">{unres} unresolved finding(s){!fresh&&doc.text.trim()?" · review is out of date":""} · {AIL[doc.ai||"none"]}</p>
      {doc.resolved.some(r=>r.status==="Sourced")&&<div className="warn" style={{background:"#eff6ff",borderColor:"#bfdbfe",color:"#1e40af"}}><b>Claims with attached sources (verify):</b>{doc.resolved.filter(r=>r.status==="Sourced").map((r,i)=><div key={i}>“{r.match}” → {r.note}</div>)}</div>}
      <div className="fg" style={{marginTop:10}}><label>{isM&&st==="In Review"?"Comment / reason (required to request changes)":isC&&needsRev(doc)?"What did you change? (required to resubmit)":"Comment"}</label><input value={c} placeholder="Write a comment…" onChange={e=>setC(e.target.value)}/></div>
      <div className="row">
        {isC&&st==="Draft"&&<button className="btn p" disabled={!doc.text.trim()||!fresh||blocked} onClick={()=>act("In Review","Submitted for review",{reason:"",author:doc.author||user.name})}>Submit for review</button>}
        {isC&&needsRev(doc)&&<button className="btn p" disabled={!doc.text.trim()||!fresh||blocked||!changed||!c.trim()} onClick={()=>act("In Review","Resubmitted (revision "+nextRev+")",{reason:"",author:doc.author||user.name})}>↻ Resubmit (revision {nextRev})</button>}
        {isC&&needsRev(doc)&&!changed&&<span className="mu">Edit the draft first.</span>}
        {isC&&needsRev(doc)&&changed&&!c.trim()&&<span className="mu">Describe what you changed.</span>}
        {isC&&(st==="Draft"||needsRev(doc))&&!fresh&&doc.text.trim()&&<span className="mu">Run the review first.</span>}
        {isC&&rs&&rs.hrBlock&&doc.found.some(f=>f.sev==="high")&&<span className="mu">🔒 Manager rule: resolve all high-risk findings before submitting.</span>}
        {isM&&st==="In Review"&&<><button className="btn r" disabled={!c.trim()} onClick={()=>act("Changes Requested","Changes requested",{reason:c.trim(),reviewer:user.name})}>Request changes</button>
          <button className="btn r" disabled={!c.trim()} onClick={()=>act("Rejected","Rejected",{reason:c.trim(),reviewer:user.name})}>Reject</button><button className="btn g" disabled={unres>0||!fresh} onClick={()=>act("Approved","Approved for publication",{approvedBy:user.name,approvedAt:nowS(),reason:""})}>Approve</button>
          {unres>0&&<span className="mu">Resolve all findings before approving.</span>}</>}
        {isC&&st==="In Review"&&<span className="mu">Waiting for a Manager to review.</span>}
        {isM&&st!=="In Review"&&<span className="mu">Nothing to review yet.</span>}
        <button className="btn" disabled={!c.trim()} onClick={()=>{const n=c.trim();setDoc(d=>({...d,comments:[...d.comments,{by:who,text:n,t:nowS()}]}));if(isM&&addN)addN(doc,"comment",n,who);setC("")}}>Comment only</button></div>
      <h3 style={{marginTop:16}}>Comments</h3>{doc.comments.map((m,i)=><div className="cm" key={i}><b>{m.by}</b> <span className="mu">{m.t}</span><div>{m.text}</div></div>)}{!doc.comments.length&&<p className="mu">No comments yet.</p>}</div>
    <div className="card"><Stepper doc={doc}/><RevTrack d={doc}/><RevCompare doc={doc}/><h3>Approval timeline</h3>{doc.tl.map((x,i)=><div key={i} className={"tli"+(/Changes|Rejected/.test(x.ev)?" bad":x.ev.startsWith("Approved")?" good":"")}><b>{x.ev}</b><div className="mu">{x.by} · {x.t}</div>{x.note&&<div>{x.note}</div>}</div>)}
      <h3 style={{marginTop:10}}>Revision history</h3>{[...doc.revs].reverse().map((r,i)=><div className="cm" key={i}><b>v{doc.revs.length-i}</b> · <span className="mu">{r.t}</span><div>{r.note}</div></div>)}{!doc.revs.length&&<p className="mu">No revisions yet.</p>}</div></div></div>;
}

function Report({doc,drafts,setCur}){
  const dsm=doc.resolved.filter(r=>r.status==="Dismissed").length,srcd=doc.resolved.filter(r=>r.status==="Sourced").length,acc=doc.resolved.length-dsm-srcd,unr=doc.found.length;
  const S=[["Brand score",score(doc)===null?"—":score(doc)+"/100"],["Content type",doc.ctype||"Social post"],["AI use",AIL[doc.ai||"none"]],...RCATS.map(c=>[c+" score",catScore(doc,c)===null?"—":catScore(doc,c)+"/100"]),["Total findings",acc+dsm+srcd+unr],["Accepted",acc],["Sourced claims",srcd],["Dismissed",dsm],["Unresolved",unr],["Reviewer",doc.approvedBy||"—"],["Approval date",doc.approvedAt||"—"]];
  const all=[...doc.found.map(f=>({...f,status:"Open"})),...doc.resolved];
  return <div><div className="row noprint" style={{justifyContent:"space-between"}}><div><h2>Content Report</h2><p className="mu">Use Print → Save as PDF in your browser.</p></div><div className="row">{drafts&&<select value={doc.id} onChange={e=>setCur(e.target.value)} style={{width:"auto",maxWidth:260}} aria-label="Choose draft">{drafts.map(d=><option key={d.id} value={d.id}>{(d.title||"Untitled")+" · "+d.status}</option>)}</select>}<button className="btn p lg" onClick={()=>window.print()}>🖨️ Print / Save as PDF</button></div></div>
    <div className="card"><h3>{doc.title||"Untitled"} <span className={"st "+doc.status.replace(" ","")}>{doc.status}</span></h3>
      <div className="sum">{S.map(s=><div className="sc" key={s[0]}><b style={{fontSize:typeof s[1]==="number"?"1.6rem":"1rem"}}>{s[1]}</b><span className="mu">{s[0]}</span></div>)}</div>
      {doc.status!=="Approved"&&<div className="warn">Not approved yet – this is an interim report.</div>}
      <h3>Content</h3><div className="view" style={{minHeight:60}}>{doc.text||"—"}</div>
      <h3 style={{marginTop:16}}>Findings</h3>{all.map((f,i)=><div className="cm" key={i}><span className={"stt "+f.status}>{f.status}</span> <b>“{f.match}”</b> <span className="mu">· {f.rule} · {f.sev}</span>{f.status!=="Open"&&<div className="mu">{f.status==="Dismissed"?"Reason: ":f.status==="Sourced"?"Source: ":"Now: "}{f.note===""?"(removed)":f.note}</div>}</div>)}{!all.length&&<p className="mu">No findings.</p>}
      <h3 style={{marginTop:16}}>Timeline</h3>{doc.tl.map((x,i)=><div className="cm" key={i}><b>{x.ev}</b> <span className="mu">{x.by} · {x.t}</span>{x.note&&<div>{x.note}</div>}</div>)}
      <p className="mu" style={{marginTop:16}}>AI-use disclosure: findings generated by an automated rules engine; all decisions made by people.</p></div></div>;
}

const AIL={none:"Human-written",assisted:"AI-assisted",generated:"AI-generated"};
const AIO=[["none","Human-written","Written by a person"],["assisted","AI-assisted","AI helped, human edited"],["generated","AI-generated","Gets stricter claim checks"]];
const CTYPES=["Social post","Blog article","Ad copy","Email / newsletter","Press release","Website copy","Other"];
const RCATS=["Tone","Claims","Terminology","Accessibility","Guideline","Visual"],CAT_ICON={Tone:"🎙️",Claims:"⚖️",Terminology:"🔤",Accessibility:"♿",Guideline:"📘",Visual:"🎨"};
const CAT_OF=r=>/^(Brand tone|Tone example)/.test(r)?"Tone":/^(Claims|Unsupported)/.test(r)?"Claims":/^Accessibility/.test(r)?"Accessibility":/^Visual/.test(r)?"Visual":/^Guideline/.test(r)?"Guideline":"Terminology";
const catScore=(d,c)=>d.reviewedText===null?null:Math.max(0,100-d.found.filter(f=>!mcl(d,f)&&CAT_OF(f.rule)===c).reduce((a,f)=>a+(f.sev==="high"?15:5),0));
const score=d=>{const x=scores(d);return x?Math.round((x.tone+x.guide+x.evid+x.vis)/4):null};
const WORD={"Banned terms":"Show the allowed alternative next to every banned word and say when exceptions (quotes, legal copy) are acceptable.","Preferred terminology":"Give the preferred term with a one-line reason and a before/after example.","Brand tone":"Add 3 do/don’t examples per tone rule, including when exclamation marks or caps are acceptable.","Tone example":"Explain the principle behind each example so writers can apply it to new sentences.","Claims policy – absolutes":"Define what counts as an absolute claim and list approved alternative phrases.","Claims policy – superlatives":"State when a superlative is allowed and which approved fact must back it.","Claims policy – AI content":"Clarify review requirements for AI-generated content.","Unsupported statistic":"Keep a list of approved figures with source and expiry date so writers can cite them."};
function Insights({drafts,seed}){
  const R={};let tot=0;
  drafts.forEach(d=>[...d.found.map(f=>({...f,status:"Open"})),...d.resolved].forEach(i=>{tot++;const r=R[i.rule]||(R[i.rule]={rule:i.rule,n:0,Open:0,Accepted:0,Edited:0,Dismissed:0,Sourced:0,reasons:[]});r.n++;r[i.status]++;if(i.status==="Dismissed"&&i.note)r.reasons.push(i.note)}));
  const rows=Object.values(R).sort((a,b)=>b.n-a.n),max=rows.length?rows[0].n:1;
  const okN=rows.reduce((a,r)=>a+r.Accepted+r.Edited+r.Sourced,0),resN=rows.reduce((a,r)=>a+r.n-r.Open,0);
  const sc=drafts.map(score).filter(x=>x!==null),avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):"—";
  const S=[["Drafts",drafts.length],["Total findings",tot],["Fix rate",resN?Math.round(okN*100/resN)+"%":"—"],["Avg brand score",avg],["Approved drafts",drafts.filter(d=>d.status==="Approved").length]];
  return <div><div className="row" style={{justifyContent:"space-between"}}><div><h2>Governance Insights</h2><p className="mu">Recurring mistakes and guidelines that writers keep pushing back on.</p></div><button className="btn p" onClick={seed}>Add sample data</button></div>
    <div className="sum">{S.map(s=><div className="sc" key={s[0]}><b style={{fontSize:"1.6rem"}}>{s[1]}</b><span className="mu">{s[0]}</span></div>)}</div>
    {!rows.length&&<div className="card"><p className="mu">No findings yet. Review some drafts, or click “Add sample data” to preview this dashboard.</p></div>}
    {rows.length>0&&<div className="stack" style={{marginTop:0}}>
      <div className="card" data-i="📈"><h3>Most triggered rules</h3>{rows.map(r=><div key={r.rule} style={{marginBottom:10}}><div className="row" style={{justifyContent:"space-between",margin:0}}><span>{r.rule}</span><b>{r.n}</b></div><div className="bar"><i style={{width:r.n*100/max+"%"}}/></div></div>)}</div>
      <div className="card" data-i="🧭"><h3>Guideline clarity detector</h3><p className="mu">A rule is flagged as possibly unclear when writers dismiss at least half of its resolved findings.</p>
        {rows.map(r=>{const res=r.n-r.Open,rate=res?Math.round(r.Dismissed*100/res):0,bad=res>=3&&rate>=50;return <div key={r.rule} className="f" style={{borderLeftColor:bad?"var(--danger)":"var(--secondary)"}}>
          <div className="row" style={{justifyContent:"space-between",margin:0}}><b>{r.rule}</b><span className={"stt "+(bad?"Open":"Accepted")}>{bad?"⚠️ Possibly unclear":"Clear"}</span></div>
          <p className="mu">Accepted/Edited {r.Accepted+r.Edited} · Sourced {r.Sourced} · Dismissed {r.Dismissed} · Open {r.Open} · Dismiss rate {rate}%</p>
          {bad&&<><p style={{margin:"6px 0 2px"}}><b>Why writers dismissed it:</b> {[...new Set(r.reasons)].slice(0,3).join("; ")||"—"}</p><p style={{margin:0}}><b>Suggested rewording:</b> {WORD[r.rule]||"Add clearer examples and exceptions to this rule."}</p></>}</div>})}</div>
    </div>}</div>;
}


// ---------- Manager role: Dashboard + Content Approval & Review ----------
const isSub=d=>d.tl.some(e=>e.ev==="Submitted for review");
const gvOf=kb=>{const o={...kb};delete o.rs;const t=JSON.stringify(o);let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return h.toString(36).slice(-5).padStart(5,"0")};
const mgrOf=(d,f)=>(d.mgr||{})[f.key];
const mcl=(d,f)=>{const m=mgrOf(d,f);return !!m&&(m.v==="fp"||m.v==="override")};
const hiAll=d=>[...d.found.filter(f=>f.sev==="high").map(f=>({...f,state:"Open"})),...d.resolved.filter(r=>r.sev==="high"&&(r.status==="Sourced"||r.status==="Dismissed")).map(r=>({...r,state:r.status}))];
const hiRisk=d=>hiAll(d).filter(f=>!mcl(d,f));
const colS=v=>v>=80?"var(--success)":v>=50?"var(--warning)":"var(--danger)";
const au=d=>d.author||"Unassigned";
// ---- Creator notifications + revision tracking helpers ----
const NT={changes:["🔄","Changes requested"],comment:["💬","New comment"],approved:["✅","Approved"],rejected:["⛔","Rejected"],rereview:["⏰","Re-review required"],expiry:["⏳","Fact expiring"],expired:["⛔","Verification required"],gcr:["📝","New change request"],gcrA:["✅","Change request approved"],gcrR:["⛔","Change request rejected"]};
const rounds=d=>d.tl.filter(e=>e.ev==="Submitted for review"||/^Resubmitted/.test(e.ev)).length;
const needsRev=d=>d.status==="Changes Requested"||d.status==="Rejected";
const SNAP=/^(Submitted for review|Resubmitted|Changes requested|Rejected)/;
const snaps=d=>d.revs.filter(r=>r.text!==undefined&&SNAP.test(r.note));
const baseSnap=d=>{const s=snaps(d);return s.length?s[s.length-1].text:null};
const prevSnap=d=>{const s=snaps(d);let i=-1;s.forEach((r,j)=>{if(/^Resubmitted/.test(r.note))i=j});return i>0?s[i-1].text:null};
const lastDec=d=>[...d.tl].reverse().find(e=>/^(Changes requested|Rejected)/.test(e.ev));
const lastResub=d=>[...d.tl].reverse().find(e=>/^Resubmitted/.test(e.ev));
const mkNs=ds=>ds.filter(d=>d.demo).flatMap(d=>{const e=[...d.tl].reverse().find(x=>/^(Changes requested|Rejected|Approved)/.test(x.ev));return e?[{id:"nd"+d.id,draftId:d.id,title:d.title,type:/^Changes/.test(e.ev)?"changes":/^Rejected/.test(e.ev)?"rejected":"approved",text:e.note||"",by:e.by,t:e.t,ts:e.ts||Date.now(),read:false}]:[]});

function DiffBox({a,b,la,lb}){const d=diffW(a,b);return <div className="ba"><div className="bf"><b>{la}</b><br/>{d.filter(x=>x[0]<=0).map((x,i)=>x[0]?<del key={i}>{x[1]}</del>:x[1])}</div><div className="af"><b>{lb}</b><br/>{d.filter(x=>x[0]>=0).map((x,i)=>x[0]?<ins key={i}>{x[1]}</ins>:x[1])}</div></div>}
function RevTrack({d}){const rows=[];d.tl.forEach(e=>{if(e.ev==="Submitted for review"||/^Resubmitted/.test(e.ev))rows.push({n:rows.length+1,e,out:null});else if(rows.length&&/^(Changes requested|Rejected|Approved)/.test(e.ev)&&!rows[rows.length-1].out)rows[rows.length-1].out=e});
  if(!rows.length)return null;
  return <div><h3>Revision tracking</h3>{rows.map(r=><div className="ex" key={r.n} style={{alignItems:"flex-start"}}><div><b>Revision {r.n}</b> <span className="mu">{r.n===1?"Initial submission":"Resubmitted"} · {r.e.by} · {r.e.t}</span>
    {r.n>1&&r.e.note&&<div>What changed: {r.e.note}</div>}
    {r.out?<div className={/^Approved/.test(r.out.ev)?"ok":"er"}>→ {r.out.ev} by {r.out.by}{r.out.note?": "+r.out.note:""}</div>:<div className="mu">→ {d.status==="In Review"&&r.n===rows.length?"Awaiting manager decision":"No decision recorded"}</div>}</div></div>)}</div>}
function NItem({n,onOpen}){const [ic,lb]=NT[n.type]||["🔔","Update"];
  return <div className={"ni "+n.type+(n.read?"":" un")} onClick={()=>onOpen(n)}><span className="ic">{ic}</span><div style={{flex:1,minWidth:0}}>
    <div className="row" style={{margin:0,justifyContent:"space-between",flexWrap:"nowrap"}}><b style={{fontSize:".9rem"}}>{lb}: {n.title||"Untitled"}</b>{!n.read&&<span className="dot"/>}</div>
    <div className="mu" style={{wordBreak:"break-word"}}>{n.sys?n.text:(n.text?"“"+n.text+"”":"No comment left")}</div>
    {(n.type==="changes"||n.type==="rejected")&&<div style={{fontSize:".78rem",color:"#b45309",fontWeight:600}}>Tap to revise &amp; resubmit →</div>}
    <div className="mu" style={{fontSize:".75rem"}}>{n.by} · {n.t}</div></div></div>}
function NotifPage({items,onOpen,markAll,clearRead}){const [f,setF]=useState("All");
  const F={All:()=>true,Unread:n=>!n.read,"Changes requested":n=>n.type==="changes",Comments:n=>n.type==="comment",Approved:n=>n.type==="approved",Rejected:n=>n.type==="rejected",Guidelines:n=>/^gcr/.test(n.type),"Fact expiry":n=>/^expir/.test(n.type)};
  const list=items.filter(F[f]);
  return <div><div className="row" style={{justifyContent:"space-between"}}><div><h2>Notifications</h2><p className="mu">Draft decisions, guideline change requests and fact-expiry reminders.</p></div>
    <div className="row"><button className="btn" disabled={!items.some(n=>!n.read)} onClick={markAll}>Mark all as read</button><button className="btn" disabled={!items.some(n=>n.read)} onClick={clearRead}>Clear read</button></div></div>
    <div className="row">{Object.keys(F).map(k=><button key={k} className={"fl"+(f===k?" on":"")} onClick={()=>setF(k)}>{k} ({items.filter(F[k]).length})</button>)}</div>
    <div className="card" style={{marginTop:10}}>{!list.length&&<p className="mu">{items.length?"Nothing in this filter.":"No notifications yet. Draft decisions, guideline change decisions and fact-expiry reminders appear here."}</p>}{list.map(n=><NItem key={n.id} n={n} onOpen={onOpen}/>)}</div></div>}

function ManagerDash({drafts,pick,seed,kb,go}){

  const del=id=>{let ds=drafts.filter(d=>d.id!==id);if(!ds.length)ds=[mk()];setDrafts(ds);if(doc.id===id)setCurId(ds[0].id)};
  const seed=()=>{if(drafts.some(d=>d.title==="Sample campaign data"))return notify("Sample data already added");
    const L=[["Banned terms","cheap","high","Dismissed","Quoting a competitor"],["Banned terms","guaranteed","high","Dismissed","Allowed in legal disclaimer"],["Banned terms","cheap","high","Dismissed","Part of a product name"],["Banned terms","world-class","high","Accepted","best"],["Brand tone","!","low","Dismissed","Casual social post needs it"],["Brand tone","!","low","Dismissed","Campaign launch style"],["Brand tone","FREE","low","Accepted","Free"],["Claims policy – superlatives","fastest","high","Accepted","fast"],["Claims policy – superlatives","best","high","Accepted","strong"],["Claims policy – superlatives","#1","high","Sourced","Industry report 2026"],["Unsupported statistic","5000 customers","high","Sourced","CRM export, Oct 2026"],["Unsupported statistic","99%","high","Sourced","Security audit"],["Preferred terminology","customers","low","Accepted","members"]];
    const d={...mk(),title:"Sample campaign data",text:"Sample data for insights.",status:"Approved",approvedBy:"Demo Manager",approvedAt:nowS(),resolved:L.map((x,i)=>({id:"s"+i,key:x[0]+"|"+x[1],rule:x[0],match:x[1],sev:x[2],status:x[3],note:x[4],why:"Sample finding",src:"Sample guideline",sug:"",conf:90}))};d.reviewedText=d.text;d.mgr={};d.resolved.forEach(f=>{const v=f.status==="Dismissed"?"fp":f.status==="Accepted"?"valid":null;if(v)d.mgr[f.key]={v,rule:f.rule,match:f.match,note:v==="fp"?f.note:"",by:"Demo Manager",t:nowS(),draft:d.title,model:AI_MODEL,conf:90}});setDrafts([...drafts,d]);notify("Sample data added","success")};
  const seedTeam=()=>{if(drafts.some(d=>d.team))return notify("Demo team data already added");setDrafts([...drafts,...mkTeam(kbx)]);notify("Demo team data added","success")};
  const seedMine=()=>{if(drafts.some(d=>d.demo&&d.author===user.name))return notify("Demo drafts already added");const m=mkMine(user.name,kbx);setDrafts([...drafts,...m]);setNs(a=>[...mkNs(m),...a]);notify("Demo drafts added","success")};
  useEffect(()=>{if(user&&!seeded){setSeeded(true);const base=kb.files&&kb.files.length?kb:DEF_KB,kk={...base,rs};setKbRaw(base);const tmv=drafts.some(d=>d.team)?[]:mkTeam(kk),mm=drafts.some(d=>d.demo&&d.author===user.name)?[]:mkMine(user.name,kk);setDrafts(ds=>[...ds.filter(d=>d.text.trim()||d.title!=="Untitled draft"||d.revs.length),...tmv,...mm]);setNs(a=>[...mkNs(mm),...a])}},[user]);
  // one-time backfill: older saved submissions get a text snapshot so revisions can be compared
  useEffect(()=>{if(!user)return;setDrafts(ds=>{let ch=false;const n=ds.map(d=>{if(!d.revs.some(r=>r.text===undefined&&/^(Submitted for review|Resubmitted)/.test(r.note)))return d;ch=true;return{...d,revs:d.revs.map(r=>r.text===undefined&&/^(Submitted for review|Resubmitted)/.test(r.note)?{...r,text:d.text}:r)}});return ch?n:ds})},[user&&user.email]);
  useEffect(()=>{if(user&&user.role==="Creator"&&unread>0)notify("🔔 You have "+unread+" unread notification"+(unread>1?"s":""))},[user&&user.role]);
  const [tick,setTick]=useState(0);useEffect(()=>{const t=setInterval(()=>setTick(x=>x+1),60000);return()=>clearInterval(t)},[]);
  useEffect(()=>{const now=Date.now(),due=drafts.filter(d=>{const n=nextReview(d);return n&&n.ts<=now});if(!due.length)return;
    setDrafts(ds=>ds.map(d=>{const n=nextReview(d);return n&&n.ts<=now?toReReview(d,n.why):d}));due.forEach(d=>addN(d,"rereview",nextReview(d).why,"System"))},[drafts,tick]);
  const go=m=>{setMode(m);setPage("auth");window.scrollTo(0,0)};
  const T=[["kb","📚","Brand Guidelines"],["dr","📝","My Drafts"],["rv","🔍","AI Content Review"],["wf","✅","Workflow"],["nt","🔔","Notifications"],["in","📊","Insights & Analytics"],["rp","📄","Reports & Audit"]];
  const MT=[["md","📊","Manager Dashboard"],["rq","🚦","Review Queue"],["rv","🔍","AI Content Review"],["ap","🛡️","Approvals"],["tm","👥","Team Management"],["bd","🧭","Brand Drift"],["fb","🧪","AI Feedback & Rules"],["kb","📚","Brand Guidelines"],["rs","⚙️","Governance & Review Controls"],["an","📈","Insights, Reports & Audit"]];
  const NB=([k,i,l])=><button key={k} className={"sb"+(tab===k?" on":"")} onClick={()=>{setTab(k);setNav(false);window.scrollTo(0,0)}}><span>{i}</span><span>{l}</span>{k==="nt"&&unread>0&&<span className="nbadge" style={{position:"static",marginLeft:"auto",border:0}}>{unread}</span>}</button>;
  const Toast=toast&&<div id="toast" className={toast.t}>{toast.m}</div>;
  const completeLogin=async result=>{
    localStorage.setItem('khabar-auth-token',result.token);
    const data=await apiRequest('/state');
    // Always clear the previous browser workspace before restoring the account's own workspace.
    for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith('khabar-')&&!['khabar-session','khabar-auth-token','khabar-key'].includes(k))localStorage.removeItem(k);}
    Object.entries(data.state||{}).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
    const team=await apiRequest('/team');localStorage.setItem('khabar-users',JSON.stringify(team.users||[]));
    localStorage.setItem('khabar-session',JSON.stringify(result.user));window.location.reload();
  };
  if(!user)return <>{Toast}{page==="landing"?<Landing go={go}/>:<Auth mode={mode} setMode={setMode} users={users} setUsers={setUsers} login={completeLogin} notify={notify} back={()=>setPage("landing")}/>}</>;
  return <>{Toast}<header className="app"><div className="container hdr"><div className="row" style={{margin:0,flexWrap:"nowrap"}}><button className="menu" aria-label="Menu" onClick={()=>setNav(o=>!o)}>☰</button><div className="logo">📰 Khabar AI</div></div>
    <div className="up">{!isM&&<span className={"st "+doc.status.replace(" ","")}>{doc.status}</span>}
      {!isM&&<div className="bell"><button className="bellb" aria-label="Notifications" title="Notifications" onClick={()=>setBell(o=>!o)}>🔔{unread>0&&<span className="nbadge">{unread}</span>}</button>
        {bell&&<><div className="nscrim" onClick={()=>setBell(false)}/><div className="npanel"><div className="row" style={{justifyContent:"space-between",margin:"0 0 8px"}}><b>Notifications</b><button className="btn" disabled={!unread} onClick={markAll}>Mark all read</button></div>
          {!mine.length&&<p className="mu">No notifications yet.</p>}{mine.slice(0,6).map(n=><NItem key={n.id} n={n} onOpen={openN}/>)}
          <button className="btn o" style={{width:"100%"}} onClick={()=>{setBell(false);setTab("nt")}}>View all notifications</button></div></>}</div>}

      <div className="profile-circle">{user.name[0].toUpperCase()}</div><div><div style={{fontWeight:600}}>{user.name}</div><div className="mu">{user.role==="Manager"?"Brand Manager / Reviewer":"Content Creator"}</div></div>
      <button className="btn o" onClick={async()=>{try{await apiRequest('/auth/logout',{method:'POST'})}catch(e){}localStorage.removeItem('khabar-auth-token');localStorage.removeItem('khabar-session');setUser(null);setPage('landing')}}>Logout</button></div></div></header>
    <div className={"scrim"+(nav?" open":"")} onClick={()=>setNav(false)}/>
    <div className="shell"><nav className={"side"+(nav?" open":"")}><div className="sbrand">KHABAR AI</div><div className="srole">{isM?"MANAGER":"CREATOR"}</div>{isM?<><div className="sl">Manager</div>{MT.map(NB)}</>:<><div className="sl">Features</div>{T.map(NB)}</>}</nav>
    <main className="content dash"><ErrorBoundary resetKey={tab}>{tab==="md"&&<ManagerDash kb={kb} drafts={drafts} seed={seedTeam} go={t=>{setTab(t);window.scrollTo(0,0)}} pick={id=>{setApSel(id);setTab("ap")}}/>}{tab==="ap"&&<Approvals kbx={kbx} rs={rs} drafts={drafts} setDrafts={setDrafts} user={user} selId={apSel} setSelId={setApSel} notify={notify} addN={addN}/>}{tab==="fb"&&<FeedbackHub drafts={drafts} kb={kb} setKb={setKb} pr={pr} setPr={setPr} user={user} notify={notify}/>}{tab==="rs"&&<ReviewSettings rs={rs} setRs={setRs} notify={notify}/>}{tab==="an"&&<AnalyticsHub drafts={drafts} seed={seedTeam} sample={seed} pr={pr} setPr={setPr} kb={kb} setKb={setKb} user={user} notify={notify} doc={doc} setCur={setCurId} kbx={kbx}/>}{tab==="rq"&&<ReviewQueue drafts={drafts} pick={id=>{setApSel(id);setTab("ap")}} seed={seedTeam} setDrafts={setDrafts} user={user} users={users} notify={notify}/>}
      {tab==="tm"&&isM&&<TeamMgmt users={users} setUsers={setUsers} drafts={drafts} user={user} notify={notify}/>}
      {tab==="bd"&&isM&&<Drift drafts={drafts} notify={notify}/>}
{tab==="kb"&&(isM?<KBHub kb={kb} setKb={setKb} commit={commit} vers={vers} user={user} restore={restoreVer} notify={notify} vis={vis} openD={openD}/>:<KBReadOnly kb={kb}/>)}
      {tab==="dr"&&<Drafts drafts={vis} seedMine={seedMine} curId={doc.id} openD={openD} openW={openW} ub={ub} newDraft={newDraft} del={del}/>}
      {tab==="rv"&&<ReviewHub doc={doc} setDoc={setDoc} kb={kb} kbx={kbx} setKb={setKb} vis={vis} setCur={setCurId} newDraft={newDraft} setDrafts={setDrafts} notify={notify} ro={!isM}/>}
      {tab==="wf"&&<Workflow rs={rs} doc={doc} setDoc={setDoc} user={user} addN={addN} onEdit={()=>{setTab("rv");window.scrollTo(0,0)}}/>}
      {tab==="nt"&&<NotifPage items={mine} onOpen={openN} markAll={markAll} clearRead={clearRead}/>}
      {tab==="in"&&<div><p className="mu noprint" style={{margin:"0 0 10px"}}>Showing insights from your own drafts only.</p><Insights drafts={vis} seed={seed}/></div>}
      {tab==="rp"&&<ReportHub doc={doc} vis={vis} setCur={setCurId} kbx={kbx} notify={notify}/>}
      {/* Cross-Channel Brand Drift is available to Managers in the Brand Drift tab. */}
      </ErrorBoundary></main></div></>;

}
async function bootKhabar(){
  const token=localStorage.getItem('khabar-auth-token');
  if(token){
    try{
      const me=await apiRequest('/auth/me');
      const saved=await apiRequest('/state');
      Object.entries(saved.state||{}).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
      const team=await apiRequest('/team');localStorage.setItem('khabar-users',JSON.stringify(team.users||[]));
      localStorage.setItem('khabar-session',JSON.stringify(me.user));
    }catch(e){localStorage.removeItem('khabar-auth-token');localStorage.removeItem('khabar-session');console.warn('Session restore:',e.message)}
  }else{localStorage.removeItem('khabar-session');}
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
}
bootKhabar();
</script>
</body>
</html>
